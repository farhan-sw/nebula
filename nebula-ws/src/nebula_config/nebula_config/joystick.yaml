joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    
    axis_linear:  # Left thumb stick vertical
      x: 0
    scale_linear:
      x: -0.5
    scale_linear_turbo:
      x: -1.0

    axis_linear:  # Left thumb stick vertical
      y: 1
    scale_linear:
      y: 0.5
    scale_linear_turbo:
      y: 1.0

    axis_angular:  # Left thumb stick horizontal
      yaw: 3
    scale_angular:
      yaw: -0.5
    scale_angular_turbo:
      yaw: -1.0

    require_enable_button: false
    # enable_button: 6  # Left shoulder button
    enable_turbo_button: 1  # Right shoulder button