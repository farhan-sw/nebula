controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    omni_wheel_controller:
      type: omni_wheel_controller/OmniWheelController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

omni_wheel_controller:
  ros__parameters:
    omni_wheel_names: ['wheel1_joint', 'wheel2_joint', 'wheel3_joint']
    omni_wheel_angle: [3.14159, -1.0472, 1.0472]
    omni_wheel_distance: 0.49
    wheel_radius: 0.05
    odom_frame_id: base_link
    base_frame_id: base_link
    # pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    # twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    enable_odom_tf: true
    cmd_vel_timeout: 3.0
    publish_limited_velocity: true
    velocity_rolling_window_size: 10

    # limits
    linear_x:
      has_velocity_limits: true
      has_acceleration_limits: false
      has_jerk_limits: false
      max_velocity: 1.0
      min_velocity: -1.0
      max_acceleration: 0.4
      min_acceleration: -0.4
      max_jerk: 0.5
      min_jerk: -0.5

    angular_z:
      has_velocity_limits: true
      has_acceleration_limits: false
      has_jerk_limits: false
      max_velocity: 1.5
      min_velocity: -1.5
      max_acceleration: 0.8
      min_acceleration: -0.8
      max_jerk: 0.5
      min_jerk: -0.5
