joy_node:
  ros__parameters:
    device_id: 0
    # deadzone: 0.05
    # autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 0  # Left thumb stick vertical
      y: 1  # Left thumb stick horizontal

    scale_linear:
      x: -0.5
      y: 0.5

    scale_linear_turbo:
      x: -1.0
      y: 1.0

    axis_angular:
      yaw: 3  # Left thumb stick horizontal

    scale_angular:
      yaw: -0.5

    scale_angular_turbo:
      yaw: -1.0

    require_enable_button: false
    enable_turbo_button: 1  # Right shoulder button
